name: Windows desktop client

on:
  push:
    branches: [main, 'codex/windows-client-*']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-dev.lock
            requirements-desktop-build.lock
      - run: python -m pip install --require-hashes -r requirements-dev.lock -r requirements-desktop-build.lock
      - run: python -m pytest -q
      - run: python -m PyInstaller --noconfirm desktop.spec
      - name: Verify the frozen app without a development Python installation
        shell: pwsh
        run: |
          $client = Start-Process -FilePath .\dist\BusinessDiagnosis\BusinessDiagnosis.exe -ArgumentList '--smoke-test', 'desktop-smoke.json' -WindowStyle Hidden -PassThru
          if (-not $client.WaitForExit(180000)) { $client.Kill(); throw 'Smoke test timed out' }
          if (Test-Path desktop-smoke.json) { Get-Content desktop-smoke.json }
          if ($client.ExitCode -ne 0) { throw 'Smoke test failed' }
          $result = Get-Content desktop-smoke.json | ConvertFrom-Json
          if (-not $result.passed -or -not $result.frozen) { throw 'Frozen app verification failed' }
      - name: Verify downloaded DLLs and the native WebView2 window
        shell: pwsh
        run: |
          foreach ($run in 1..3) {
            Get-ChildItem .\dist\BusinessDiagnosis\_internal -Recurse -Filter '*.dll' | ForEach-Object {
              Set-Content -LiteralPath $_.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`nZoneId=3"
            }
            $report = "desktop-gui-smoke-$run.json"
            $client = Start-Process -FilePath .\dist\BusinessDiagnosis\BusinessDiagnosis.exe -ArgumentList '--gui-smoke-test', $report -WindowStyle Hidden -PassThru
            if (-not $client.WaitForExit(180000)) { $client.Kill(); throw 'Native window test timed out' }
            if (Test-Path $report) { Get-Content $report }
            if ($client.ExitCode -ne 0) { throw "Native window test $run failed" }
            $result = Get-Content $report | ConvertFrom-Json
            if (-not $result.passed -or -not $result.frozen) { throw 'Native frozen app verification failed' }
            if (Get-Item .\dist\BusinessDiagnosis\_internal\pythonnet\runtime\Python.Runtime.dll -Stream Zone.Identifier -ErrorAction SilentlyContinue) {
              throw 'Bundled CLR library remained blocked after startup'
            }
          }
      - run: python -m scripts.package_desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-client
          path: |
            dist/BusinessDiagnosis-*-windows-x64.zip
            dist/BusinessDiagnosis-*-windows-x64.zip.sha256
            desktop-smoke.json
            desktop-gui-smoke*.json
