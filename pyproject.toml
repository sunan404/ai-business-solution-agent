[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-business-solution-agent"
version = "0.2.0"
description = "Evidence-grounded business diagnosis with local rules and optional LLM"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "streamlit>=1.36,<2", "pandas>=2.1,<3", "openpyxl>=3.1,<4",
  "openai>=1.0,<3", "python-dotenv>=1.0,<2", "tzdata>=2025.1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=6,<8", "ruff>=0.11,<1", "mypy>=1.15,<2", "build>=1.2,<2"]
demo = ["playwright>=1.50,<2", "imageio-ffmpeg>=0.6,<1"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110
exclude = [".agents", "node_modules", ".venv", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
files = ["src/config.py", "src/budget.py", "src/observability.py", "src/priority.py", "src/security.py"]
check_untyped_defs = true
disallow_untyped_defs = true

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
fail_under = 75
