name: Windows desktop client

on:
  push:
    branches: [main, 'codex/windows-client-*']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-dev.lock
            requirements-desktop-build.lock
      - run: python -m pip install --require-hashes -r requirements-dev.lock -r requirements-desktop-build.lock
      - run: python -m pytest -q
      - run: python -m PyInstaller --noconfirm desktop.spec
      - name: Verify the frozen app without a development Python installation
        shell: pwsh
        run: |
          $client = Start-Process -FilePath .\dist\BusinessDiagnosis\BusinessDiagnosis.exe -ArgumentList '--smoke-test', 'desktop-smoke.json' -WindowStyle Hidden -PassThru
          if (-not $client.WaitForExit(180000)) { $client.Kill(); throw 'Smoke test timed out' }
          if (Test-Path desktop-smoke.json) { Get-Content desktop-smoke.json }
          if ($client.ExitCode -ne 0) { throw 'Smoke test failed' }
          $result = Get-Content desktop-smoke.json | ConvertFrom-Json
          if (-not $result.passed -or -not $result.frozen) { throw 'Frozen app verification failed' }
      - name: Verify the native WebView2 window
        shell: pwsh
        run: |
          $client = Start-Process -FilePath .\dist\BusinessDiagnosis\BusinessDiagnosis.exe -ArgumentList '--gui-smoke-test', 'desktop-gui-smoke.json' -WindowStyle Hidden -PassThru
          if (-not $client.WaitForExit(180000)) { $client.Kill(); throw 'Native window test timed out' }
          if (Test-Path desktop-gui-smoke.json) { Get-Content desktop-gui-smoke.json }
          if ($client.ExitCode -ne 0) { throw 'Native window test failed' }
          $result = Get-Content desktop-gui-smoke.json | ConvertFrom-Json
          if (-not $result.passed -or -not $result.frozen) { throw 'Native frozen app verification failed' }
      - run: python -m scripts.package_desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-client
          path: |
            dist/BusinessDiagnosis-*-windows-x64.zip
            dist/BusinessDiagnosis-*-windows-x64.zip.sha256
            desktop-smoke.json
            desktop-gui-smoke.json
